name: Feature request
description: Suggest a dungeon analysis capability for OpenSpec review
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Player workflow and expected outcome
      description: Describe the dungeon scenario and the decision this feature would support.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Forever API evidence or open questions
      description: Link source or describe a repeatable in-game test where known.
