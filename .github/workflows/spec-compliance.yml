name: SDD Compliance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read

jobs:
  traceability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check metadata, scope and reviewed proposal
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../trusted/scripts/validate-traceability.mjs
